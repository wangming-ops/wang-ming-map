  const countyLevel = DATA.filter(d => d.level === '区县级').length;
  const provPlatforms = DATA.filter(d => d.level === '省级平台').length;
  const withProject = DATA.filter(d => d.hasProject).length;
  
  const cards = [
    { num: total, label: '公司总数', cls: '' },
    { num: inSystem, label: '体系内公司', cls: 'green' },
    { num: topParents, label: '顶层母公司', cls: 'accent' },
    { num: directCount, label: '直接控股', cls: 'blue' },
    { num: indirectCount, label: '间接控股', cls: '' },
    { num: toVerify, label: '待核实', cls: 'accent' },
    { num: countyLevel, label: '区县级公司', cls: '' },
    { num: provPlatforms, label: '省级平台', cls: 'blue' },
    { num: withProject, label: '有项目公司', cls: 'green' },
    { num: 28, label: '覆盖省份', cls: '' }
  ];
  
  document.getElementById('statsCards').innerHTML = cards.map(c => 
    '<div class="card '+c.cls+'"><div class="num">'+c.num+'</div><div class="label">'+c.label+'</div></div>'
  ).join('');
}

// ===== Province Options =====
function initProvinceFilter() {
  const provinces = [...new Set(DATA.map(d => d.province))].sort();
  const sel = document.getElementById('provinceFilter');
  provinces.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p; opt.textContent = p;
    sel.appendChild(opt);
  });
}

// ===== Table =====
let filteredData = [];
let currentPage = 1;
const pageSize = 25;
let sortCol = -1, sortAsc = true;
let expandedRows = new Set();

function applyFilters() {
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const depth = document.getElementById('depthFilter').value;
  const type = document.getElementById('typeFilter').value;
  const level = document.getElementById('levelFilter').value;
  const province = document.getElementById('provinceFilter').value;
  const project = document.getElementById('projectFilter').value;
  const legal = document.getElementById('legalFilter').value;
  
  filteredData = DATA.filter(d => {
    if (search && !d.name.toLowerCase().includes(search)) return false;
    if (depth !== '' && d.depth !== parseInt(depth)) return false;
    if (type && d.type !== type) return false;
    if (level && d.level !== level) return false;
    if (province && d.province !== province) return false;
    if (project === '__has__' && !d.hasProject) return false;
    if (project === '__no__' && d.hasProject) return false;
    if (project && project !== '__has__' && project !== '__no__') {
      if (!d.projects || !d.projects.includes(project)) return false;
    }
    if (legal && d.legal !== legal) return false;
    return true;
  });
  
  document.getElementById('resultCount').textContent = filteredData.length;
  currentPage = 1;
  renderTable();
}

function sortTable(col) {
  if (sortCol === col) { sortAsc = !sortAsc; } else { sortCol = col; sortAsc = true; }
  const keys = ['name','name','province','level','depth','type','share',
    'legal'
  ];
  const key = keys[col];
  filteredData.sort((a,b) => {
    let va = a[key], vb = b[key];
    if (key === 'depth') { va = parseInt(va)||0; vb = parseInt(vb)||0; }
    if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });
  renderTable();
}

function renderTable() {
  const start = (currentPage - 1) * pageSize;
  const pageData = filteredData.slice(start, start + pageSize);
  const tbody = document.getElementById('tableBody');
  let html = '';
  
  pageData.forEach((d, i) => {
    const idx = start + i + 1;
    const isExpanded = expandedRows.has(d.name);
    const escapedName = d.name.replace(/'/g, "\\'");
    html += '<tr class="'+(isExpanded?'expanded':'')+'" onclick="toggleDetail(\''+escapedName+'\')">' +
      '<td>'+idx+'</td>' +
      '<td style="font-weight:500">'+d.name+'</td>' +
      '<td>'+d.province+'</td>' +
      '<td>'+d.level+'</td>' +
      '<td><span class="tag tag-'+d.depth+'">第'+d.depth+'层</span></td>' +
      '<td><span class="tag-type type-'+d.type+'">'+d.type+'</span></td>' +
      '<td>'+(d.share || '-')+'</td>' +
      '<td>'+(d.legal || '-')+'</td>' +
      '<td style="font-size:12px;color:#666;line-height:1.4">'+(d.projects && d.projects.length ? d.projects.join('<br>') : '暂无')+'</td>' +
      '<td><span style="cursor:pointer;font-size:16px">'+(isExpanded?'▲':'▼')+'</span></td>' +
      '</tr>';
    if (isExpanded) {
      html += '<tr class="detail-row"><td colspan="10">' +
        '<div class="detail-content">' +
        '<p><strong>公司全称：</strong>'+d.name+'</p>' +
        '<p><strong>所在省份：</strong>'+d.province+'</p>' +
        '<p><strong>行政层级：</strong>'+d.level+'</p>' +
        '<p><strong>股权深度：</strong>第'+d.depth+'层</p>' +
        '<p><strong>控股方式：</strong>'+d.type+'</p>' +
        '<p><strong>持股比例：</strong>'+(d.share || '未知')+'</p>' +
        '<p><strong>法定代表人：</strong>'+(d.legal || '—')+'</p>' +
        '<p><strong>注册资本：</strong>'+(d.capital || '—')+'</p>' +
        '<p><strong>对应项目：</strong>'+(d.projects && d.projects.length ? d.projects.join('、') : '暂无')+'</p>' +
        '<p><strong>直接母公司：</strong>'+(d.parent || '—')+'</p>' +
        '<p><strong>股权路径：</strong>'+(d.path || '—')+'</p>' +
        '</div></td></tr>';
    }
  });
  
  tbody.innerHTML = html;
  renderPagination();
}

function toggleDetail(name) {
  if (expandedRows.has(name)) expandedRows.delete(name);
  else expandedRows.add(name);
  renderTable();
}

function renderPagination() {
  const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
  let html = '<button '+(currentPage===1?'disabled':'')+' onclick="goPage('+(currentPage-1)+')">上一页</button>';
  
  const maxShow = 7;
  let startP = Math.max(1, currentPage - 3);
  let endP = Math.min(totalPages, startP + maxShow - 1);
  if (endP - startP < maxShow - 1) startP = Math.max(1, endP - maxShow + 1);
  
  if (startP > 1) html += '<button onclick="goPage(1)">1</button><span>...</span>';
  for (let p = startP; p <= endP; p++) {
    html += '<button class="'+(p===currentPage?'active':'')+'" onclick="goPage('+p+')">'+p+'</button>';
  }
  if (endP < totalPages) html += '<span>...</span><button onclick="goPage('+totalPages+')">'+totalPages+'</button>';
  
  html += '<button '+(currentPage===totalPages?'disabled':'')+' onclick="goPage('+(currentPage+1)+')">下一页</button>';
  html += '<span>共 '+filteredData.length+' 条 / '+totalPages+' 页</span>';
  document.getElementById('pagination').innerHTML = html;
}

function goPage(p) { currentPage = p; renderTable(); }

// ===== Tree =====
function buildTree() {
  const childrenOf = {};
  DATA.forEach(d => {
    if (d.parent) {
      if (!childrenOf[d.parent]) childrenOf[d.parent] = [];
      childrenOf[d.parent].push(d);
    }
  });
  
  function makeTreeNode(comp) {
    const kids = (childrenOf[comp.name] || []).filter(k => k.name !== '鹏辉力赫（天津）能源科技有限公司');
    return {
      name: comp.name,
      province: comp.province,
      type: comp.type,
      share: comp.share,
      children: kids.map(k => makeTreeNode(k))
    };
  }
  
  const liheGroup = DATA.find(d => d.name === '力赫（天津）新能源科技集团有限公司');
  const penghuiTJ = DATA.find(d => d.name === '鹏辉力赫（天津）能源科技有限公司');
  
  const treeRoot = makeTreeNode(liheGroup);
  const penghuiNode = makeTreeNode(penghuiTJ);
  treeRoot.children.unshift(penghuiNode);
  
  return treeRoot;
}

function renderTree() {
  const tree = buildTree();
  const container = document.getElementById('treeContainer');
  container.innerHTML = renderTreeNode(tree, 0);
}

function renderTreeNode(node, level) {
  const hasChildren = node.children && node.children.length > 0;
  let html = '<div class="tree-node">' +
    '<div class="tree-label" onclick="toggleTreeNode(this)" data-name="'+node.name.replace(/"/g,'&quot;')+'">' +
    '<span class="toggle">'+(hasChildren ? '▶' : '•')+'</span>' +
    '<span class="node-name">'+node.name+'</span>' +
    '<span class="node-info">['+node.province+']'+(node.share ? ' '+node.share : '')+'</span>' +
    '</div>';
  if (hasChildren) {
    html += '<div class="tree-children'+(level > 1 ? ' collapsed' : '')+'">';
    node.children.forEach(child => {
      html += renderTreeNode(child, level + 1);
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function toggleTreeNode(el) {
  const children = el.nextElementSibling;
  const toggle = el.querySelector('.toggle');
  if (children && children.classList.contains('tree-children')) {
    children.classList.toggle('collapsed');
    toggle.textContent = children.classList.contains('collapsed') ? '▶' : '▼';
  }
  const name = el.dataset.name;
  highlightInTable(name);
}

function highlightInTable(name) {
  document.getElementById('searchInput').value = name;
  applyFilters();
  document.getElementById('companyTable').scrollIntoView({ behavior:'smooth' });
}

function expandAll() {
  document.querySelectorAll('.tree-children').forEach(el => el.classList.remove('collapsed'));
  document.querySelectorAll('.tree-label .toggle').forEach(el => { if(el.textContent==='▶') el.textContent='▼'; });
}
function collapseAll() {
  document.querySelectorAll('.tree-children').forEach(el => el.classList.add('collapsed'));
  document.querySelectorAll('.tree-label .toggle').forEach(el => { if(el.textContent==='▼') el.textContent='▶'; });
}

// ===== Charts =====
function renderCharts() {

  const typeCounts = {};

    tooltip: { trigger:'item', formatter:'{b}: {c}家 ({d}%)' },

    series: [{
      type:'pie', radius:['35%','65%'], center:['50%','45%'],

    }]

  // Chart 2: 行政层级分布
  const levelCounts = {};

  const chart2 = echarts.init(document.getElementById('chart2'));
  chart2.setOption({
    tooltip: { trigger:'item', formatter:'{b}: {c}家 ({d}%)' },
    legend: { bottom:0, textStyle:{fontSize:11} },
    color: ['#1a237e','#0d47a1','#1565c0','#42a5f5'],
    series: [{
      type:'pie', radius:['35%','65%'], center:['50%','45%'],
      label: { formatter:'{b}\n{c}家', fontSize:11 },
      data: Object.entries(levelCounts).map(([k,v]) => ({name:k, value:v}))
    }]
  });
  
  // Chart 3: 各省份公司数量
  const provCounts = {};
  DATA.forEach(d => { provCounts[d.province] = (provCounts[d.province]||0) + 1; });
  const provSorted = Object.entries(provCounts).sort((a,b) => a[1]-b[1]);
  const chart3 = echarts.init(document.getElementById('chart3'));
  chart3.setOption({
    tooltip: { trigger:'axis' },
    grid: { left:100, right:60, top:10, bottom:30 },
    xAxis: { type:'value' },
    yAxis: { type:'category', data:provSorted.map(p=>p[0]), axisLabel:{fontSize:12} },
    series: [{
      type:'bar', data:provSorted.map(p=>p[1]),
      itemStyle: { color: new echarts.graphic.LinearGradient(0,0,1,0,[
        {offset:0,color:'#1a237e'},{offset:1,color:'#42a5f5'}
      ]), borderRadius:[0,4,4,0] },
      label: { show:true, position:'right', fontSize:12 }
    }]
  });
  
  // Chart 4: 各股权深度
  const depthCounts = {};
  DATA.forEach(d => { depthCounts[d.depth] = (depthCounts[d.depth]||0) + 1; });
  const chart4 = echarts.init(document.getElementById('chart4'));
  chart4.setOption({
    tooltip: { trigger:'axis' },
    grid: { left:60, right:40, top:30, bottom:40 },
    xAxis: { type:'category', data:['第0层','第1层','第2层','第3层','第4层'], axisLabel:{fontSize:13} },
    yAxis: { type:'value' },
    series: [{
      type:'bar', barWidth:50,
      data: [
        {value:depthCounts[0]||0, itemStyle:{color:'#f9a825'}},
        {value:depthCounts[1]||0, itemStyle:{color:'#43a047'}},
        {value:depthCounts[2]||0, itemStyle:{color:'#1e88e5'}},
        {value:depthCounts[3]||0, itemStyle:{color:'#fb8c00'}},
        {value:depthCounts[4]||0, itemStyle:{color:'#e53935'}}
      ],
      label: { show:true, position:'top', fontSize:14, fontWeight:'bold' },
      itemStyle: { borderRadius:[6,6,0,0] }
    }]
  });
  
  window.addEventListener('resize', () => {
    chart1.resize(); chart2.resize(); chart3.resize(); chart4.resize();
  });
}

// ===== Init =====
renderStats();
initProvinceFilter();
applyFilters();
renderTree();
renderCharts();
</script>
